name: CGL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  cgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Audit dependencies
        run: composer audit

      - name: Analyze dependencies
        run: composer check:deps

      - name: Lint composer.json
        run: composer check:style:composer

      - name: Lint .editorconfig
        run: composer check:style:editorconfig

      - name: Lint PHP
        run: composer check:style:php

      - name: SCA PHP
        run: composer check:static -- --error-format github

      - name: Migration
        run: composer check:refactor
